# Build, verify and submit a release to the extension stores.
#
# Triggered by pushing a version tag, or manually with a dry run to check
# credentials without uploading anything.
#
# A store is only submitted to if its secrets are configured. That is the
# switch: adding Firefox to a release means adding FIREFOX_JWT_ISSUER and
# friends, and nothing else. It also means a half-configured repository
# releases to the stores it can rather than failing the whole job.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Check credentials and build, but upload nothing'
        type: boolean
        default: true

concurrency:
  # Two releases uploading to one store listing at once is a good way to get a
  # confusing rejection. Never cancel a release mid-upload.
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The tag is the version users will see. A mismatch means shipping a
      # package whose manifest disagrees with the release it came from, and
      # every store rejects a version that does not increase.
      - name: Check the tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          TAG="${GITHUB_REF_NAME#v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "::error::tag v$TAG does not match package.json $PKG"
            exit 1
          fi
          echo "releasing $PKG"

      - run: npm run typecheck
      - run: npm test

      # The e2e suite drives the production build in a real Chromium, which is
      # the only place the content script and the worker are actually exercised.
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e

      - name: Build store packages
        run: |
          npm run zip:store
          npm run zip:firefox

      - name: Submit
        env:
          # Chrome — API v2 service account. Absent secrets disable the store.
          CHROME_EXTENSION_ID: ${{ secrets.CHROME_EXTENSION_ID }}
          CHROME_PUBLISHER_ID: ${{ secrets.CHROME_PUBLISHER_ID }}
          CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL: ${{ secrets.CHROME_SERVICE_ACCOUNT_CLIENT_EMAIL }}
          CHROME_SERVICE_ACCOUNT_PRIVATE_KEY: ${{ secrets.CHROME_SERVICE_ACCOUNT_PRIVATE_KEY }}
          CHROME_API_VERSION: v2
          # Firefox — AMO JWT credentials.
          FIREFOX_EXTENSION_ID: ${{ secrets.FIREFOX_EXTENSION_ID }}
          FIREFOX_JWT_ISSUER: ${{ secrets.FIREFOX_JWT_ISSUER }}
          FIREFOX_JWT_SECRET: ${{ secrets.FIREFOX_JWT_SECRET }}
          # Edge — Partner Center API.
          EDGE_PRODUCT_ID: ${{ secrets.EDGE_PRODUCT_ID }}
          EDGE_CLIENT_ID: ${{ secrets.EDGE_CLIENT_ID }}
          EDGE_API_KEY: ${{ secrets.EDGE_API_KEY }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npm run submit
