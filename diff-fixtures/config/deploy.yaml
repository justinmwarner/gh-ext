# The service the review page talks to.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: review-api
  labels:
    app: review-api
    tier: backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: review-api
  template:
    metadata:
      labels:
        app: review-api
    spec:
      containers:
        - name: api
          image: ghcr.io/acme/review-api:2.0.4
          ports:
            - containerPort: 8080
          env:
            # Raised to debug while we chase the anchor bug.
            - name: LOG_LEVEL
              value: info
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
