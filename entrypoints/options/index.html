<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="manifest.open_in_tab" content="true" />
    <title>Fast GitHub Review — Options</title>
    <style>
      body {
        /* The review page declares the same pair, and both Pierre packages
           theme themselves this way. Without it this is the one screen in the
           extension that cannot follow the OS — and it is the first screen a
           new reviewer sees, reached from a dark review page by a button, as a
           full-window white flash. */
        color-scheme: light dark;
        margin: 0;
        padding: 2rem;
        font: 14px/1.5 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
        color: light-dark(#1f2328, #e6edf3);
        background: light-dark(#ffffff, #0d1117);
      }
      main {
        max-width: 44rem;
      }
      h1 {
        font-size: 1.375rem;
        margin: 0 0 1.5rem;
      }
      h2 {
        font-size: 1rem;
        margin: 2rem 0 0.5rem;
      }
      label {
        display: block;
        font-weight: 600;
        margin-bottom: 0.25rem;
      }
      input[type="password"] {
        width: 100%;
        box-sizing: border-box;
        padding: 0.4rem 0.6rem;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        font-size: 13px;
        border: 1px solid light-dark(#d1d9e0, #3d444d);
        border-radius: 6px;
      }
      .actions {
        display: flex;
        gap: 0.5rem;
        margin-top: 0.75rem;
      }
      button {
        padding: 0.4rem 0.85rem;
        font: inherit;
        border: 1px solid light-dark(#d1d9e0, #3d444d);
        border-radius: 6px;
        background: light-dark(#f6f8fa, #212830);
        cursor: pointer;
      }
      button:disabled {
        opacity: 0.5;
        cursor: default;
      }
      /* The setup walkthrough. Numbers matter here — this is a sequence
         someone follows on another site with this page beside it. */
      ol.setup {
        margin: 0 0 1.5rem;
        padding-left: 1.25rem;
        line-height: 1.6;
      }
      ol.setup li { margin-bottom: 0.6rem; }
      ol.setup a { color: inherit; }
      table.perms {
        border-collapse: collapse;
        margin: 0.6rem 0 0.2rem;
        font-size: 0.9em;
      }
      table.perms th,
      table.perms td {
        text-align: left;
        padding: 0.25rem 0.9rem 0.25rem 0;
        border-bottom: 1px solid color-mix(in srgb, currentColor 15%, transparent);
        vertical-align: top;
      }
      table.perms th { font-weight: 600; opacity: 0.7; }
      .hint {
        color: light-dark(#59636e, #9198a1);
        margin: 0.35rem 0 0;
      }
      .warning {
        border: 1px solid light-dark(#cf222e, #f85149);
        border-left-width: 4px;
        border-radius: 6px;
        padding: 0.75rem 1rem;
        margin: 1.5rem 0;
      }
      .warning h2 {
        margin: 0 0 0.5rem;
        color: light-dark(#cf222e, #f85149);
      }
      .warning p {
        margin: 0 0 0.5rem;
      }
      .warning p:last-child {
        margin-bottom: 0;
      }
      .result {
        margin: 0.75rem 0 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      .result.bad {
        color: light-dark(#cf222e, #f85149);
      }
      .result.good {
        color: light-dark(#1a7f37, #3fb950);
      }
      dl {
        display: grid;
        grid-template-columns: max-content 1fr;
        gap: 0.25rem 1rem;
        margin: 0;
      }
      dt {
        color: light-dark(#59636e, #9198a1);
      }
      dd {
        margin: 0;
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
      }
      code {
        font-family: ui-monospace, SFMono-Regular, Menlo, monospace;
        background: light-dark(#f6f8fa, #212830);
        padding: 0.05rem 0.3rem;
        border-radius: 4px;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="./main.tsx"></script>
  </body>
</html>
