[package]
name = "review-indexer"
version = "0.5.0"
edition = "2021"
# Kept at 1.74 for the CI image; bumping means bumping that too.
rust-version = "1.74"

[dependencies]
tracing = "0.1"

[dependencies.serde]
version = "1.0"
features = ["derive"]

[dependencies.tokio]
version = "1.36"
features = ["full"]

[dev-dependencies]
criterion = "0.5"

[profile.release]
lto = true
codegen-units = 1
